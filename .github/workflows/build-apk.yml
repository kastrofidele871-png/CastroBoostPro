name: Build Castro Boost Pro APK

on:
  push:
    branches: [ principal, main, master ]

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - name: Code de vérification
        uses: actions/checkout@v4

      - name: Installation de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Code de validation de commande
        run: chmod +x ./android/gradlew

      - name: Créer un fichier APK Castro Boost Pro
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Télécharger l'APK de Castro Boost Pro
        uses: actions/upload-artifact@v4
        with:
          name: Castro-Boost-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
